name: stockwise

services:
  postgres:
    image: postgres:18.1
    container_name: stockwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockwise
      POSTGRES_PASSWORD: stockwise
      POSTGRES_DB: stockwise
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18+ keeps its data in a versioned subdirectory, so mount the parent.
      - postgres-data:/var/lib/postgresql
      # Runs only when the volume is first initialised.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockwise -d stockwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: stockwise-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (backend MAIL_PORT)
      - "8025:8025" # Web inbox: http://localhost:8025

volumes:
  postgres-data:
